services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: presto
      POSTGRES_USER: presto
      POSTGRES_PASSWORD: presto
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  web:
    build: .
    command: >
      bash -c "export PYTHONPATH=/app && \
               python manage.py migrate --no-input && \
               python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://presto:presto@db:5432/presto
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_SECRET_KEY=django-insecure-dev-key-do-not-use-in-prod
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: .
    command: >
      bash -c "export PYTHONPATH=/app && \
               celery -A config worker -l info"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://presto:presto@db:5432/presto
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_SECRET_KEY=django-insecure-dev-key-do-not-use-in-prod
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app

  beat:
    build: .
    command: >
      bash -c "export PYTHONPATH=/app && \
               celery -A config beat -l info --schedule /var/celerybeat/celerybeat-schedule"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://presto:presto@db:5432/presto
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DJANGO_SECRET_KEY=django-insecure-dev-key-do-not-use-in-prod
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - celerybeat:/var/celerybeat

volumes:
  pg_data:
  celerybeat: