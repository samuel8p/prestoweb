[project]
name = "presto"
version = "0.1.0"
description = "Finanzas e inversiones con marketplace de préstamos"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0",
    "djangorestframework>=3.14",
    "drf-spectacular>=0.30",
    "djangorestframework-simplejwt>=5.3",
    "pytest>=7.0",
    "pytest-django>=5.0",
    "factory-boy>=3.0",
    "ruff>=0.1.0",
    "import-linter>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "argon2-cffi>=21.0.0",
    "gunicorn>=22.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "dj-database-url>=2.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"