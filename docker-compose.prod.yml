# Entorno de producción de Presto.
#
# Este archivo NO tiene ningún secreto: todo lo sensible llega por variables de
# entorno (archivo `.env.prod` o el orquestador). Los valores con `${VAR:-}`
# son solo defaults no sensibles.
#
# Antes de levantar:
#   1. crear un `.env.prod` con POSTGRES_PASSWORD, DJANGO_SECRET_KEY,
#      DJANGO_ALLOWED_HOSTS (y los opcionales CORS_ALLOWED_ORIGINS, SENTRY_DSN)
#   2. `docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build`
#
# El proxy inverso (Nginx o Caddy) debe terminar TLS y apuntar a
# 127.0.0.1:8000. `beat` corre **una sola instancia**: escalar el worker sí
# está permitido, el scheduler no.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-presto}
      POSTGRES_USER: ${POSTGRES_USER:-presto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      bash -c "export PYTHONPATH=/app &&
               python manage.py migrate --no-input &&
               gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-presto}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-presto}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_ENV: production
      LEDGER_SIMULATED_DEPOSITS_ENABLED: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    command: >
      bash -c "export PYTHONPATH=/app &&
               celery -A config worker -l info"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-presto}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-presto}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_ENV: production
      LEDGER_SIMULATED_DEPOSITS_ENABLED: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0

  beat:
    build: .
    restart: unless-stopped
    command: >
      bash -c "export PYTHONPATH=/app &&
               celery -A config beat -l info --schedule /var/celerybeat/celerybeat-schedule"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-presto}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-presto}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_ENV: production
      LEDGER_SIMULATED_DEPOSITS_ENABLED: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - celerybeat:/var/celerybeat

volumes:
  pg_data:
  celerybeat:
