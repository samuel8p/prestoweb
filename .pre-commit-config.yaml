repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/seddonym/import-linter
    rev: v2.15
    hooks:
      - id: import-linter
        args: [--config, .importlinter]

ci:
  autofix_commit_msg_style: "Conventional Commits"
  autofix_prerequisites: ["ruff"]