openapi: 3.0.3
info:
  title: Presto API
  version: 1.0.0
  description: API de finanzas e inversiones con marketplace de préstamos.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Valida las credenciales y devuelve access y refresh tokens.
      summary: Iniciar sesión y obtener tokens JWT
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
          headers:
            X-Presto-Mode:
              description: Vale `demo` cuando la aplicación corre en modo demo.
              schema:
                type: string
        '400':
          description: Los datos enviados no son válidos (el `details` dice el campo).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: validation_error
                      message:
                        type: string
                        example: Los datos enviados no son válidos.
                      details:
                        type: object
                        example:
                          amount:
                          - A valid number is required.
                    required:
                    - code
                    - message
                required:
                - error
              example:
                error:
                  code: validation_error
                  message: Los datos enviados no son válidos.
                  details: {}
          headers:
            X-Presto-Mode:
              description: Vale `demo` cuando la aplicación corre en modo demo.
              schema:
                type: string
        '429':
          description: Demasiados intentos (throttle).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: validation_error
                      message:
                        type: string
                        example: Los datos enviados no son válidos.
                      details:
                        type: object
                        example:
                          amount:
                          - A valid number is required.
                    required:
                    - code
                    - message
                required:
                - error
              example:
                error:
                  code: throttled
                  message: Demasiadas solicitudes. Intentá de nuevo más tarde.
                  details: {}
          headers:
            X-Presto-Mode:
              description: Vale `demo` cuando la aplicación corre en modo demo.
              schema:
                type: string
