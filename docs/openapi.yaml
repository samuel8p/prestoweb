components:
  schemas:
    AcceptOffer:
      type: object
      description: Datos para aceptar una oferta.
      properties:
        offer_id:
          type: string
          format: uuid
      required:
      - offer_id
    Account:
      type: object
      description: Datos de una cuenta y su saldo.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance
      - created_at
      - currency
      - id
      - kind
      - user_id
    Alias:
      type: object
      description: El alias que el usuario se pone o cambia.
      properties:
        alias:
          type: string
          description: 'Identificador público: 6 a 20 caracteres, minúsculas, dígitos,
            punto, guion o guion bajo; empieza y termina con letra o dígito.'
          maxLength: 20
      required:
      - alias
    AliasResponse:
      type: object
      description: El alias del usuario (null si no tiene).
      properties:
        alias:
          type: string
          nullable: true
          description: El alias del usuario, o null si todavía no tiene.
    Balance:
      type: object
      description: Saldo de una cuenta.
      properties:
        account_id:
          type: string
          format: uuid
        currency:
          type: string
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - account_id
      - balance
      - currency
    Budget:
      type: object
      description: Presupuesto mensual de una categoría.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        period:
          allOf:
          - $ref: '#/components/schemas/PeriodEnum'
          readOnly: true
        limit_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          readOnly: true
        alert_threshold:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - alert_threshold
      - category
      - created_at
      - currency
      - id
      - limit_amount
      - period
    BudgetStatus:
      type: object
      description: Estado del presupuesto en un período.
      properties:
        budget_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        period:
          type: string
        currency:
          type: string
        year:
          type: integer
        month:
          type: integer
        limit_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        spent_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        remaining_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        threshold_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        alert_triggered:
          type: boolean
      required:
      - alert_triggered
      - budget_id
      - category_id
      - currency
      - limit_amount
      - month
      - period
      - remaining_amount
      - spent_amount
      - threshold_amount
      - year
    Category:
      type: object
      description: Categoría de gasto del usuario.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    CompareOffers:
      type: object
      description: Identificadores de las ofertas a comparar.
      properties:
        offer_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 2
      required:
      - offer_ids
    CreateAccount:
      type: object
      description: Datos para crear la billetera del usuario en una moneda.
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
      required:
      - currency
    CreateBudget:
      type: object
      description: Datos para crear un presupuesto.
      properties:
        category_id:
          type: string
          format: uuid
        limit_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        alert_threshold:
          type: integer
          maximum: 100
          minimum: 0
      required:
      - alert_threshold
      - category_id
      - currency
      - limit_amount
    CreateCategory:
      type: object
      description: Datos para crear una categoría de gasto.
      properties:
        name:
          type: string
          maxLength: 100
      required:
      - name
    CreateExpense:
      type: object
      description: Datos para categorizar un movimiento del ledger como gasto.
      properties:
        category_id:
          type: string
          format: uuid
        ledger_transaction_id:
          type: string
          format: uuid
      required:
      - category_id
      - ledger_transaction_id
    CreateOffer:
      type: object
      description: Datos para publicar una oferta.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        interest_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        term_months:
          type: integer
          minimum: 1
        requirements:
          type: string
          maxLength: 2000
      required:
      - amount
      - currency
      - interest_rate
      - term_months
    CreateTransaction:
      type: object
      description: Datos para crear un movimiento de dinero.
      properties:
        type:
          $ref: '#/components/schemas/CreateTransactionTypeEnum'
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        destination_account_id:
          type: string
          format: uuid
          nullable: true
        description:
