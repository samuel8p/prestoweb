    PatchedMeUpdate:
      type: object
      description: Campos del perfil que el usuario puede actualizar sobre sí mismo.
      properties:
        phone_number:
          type: string
          maxLength: 32
        date_of_birth:
          type: string
          format: date
          nullable: true
        country:
          oneOf:
          - type: string
            pattern: ^[A-Z]{2}$
            maxLength: 2
          - type: string
            maxLength: 0
    PatchedUpdateOffer:
      type: object
      description: Datos que el prestamista puede modificar en su oferta.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        interest_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        term_months:
          type: integer
          minimum: 1
        requirements:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/UpdateOfferStatusEnum'
    PeriodEnum:
      enum:
      - monthly
      type: string
      description: '* `monthly` - Mensual'
    Position:
      type: object
      description: Datos de una posición de inversión.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PositionStatusEnum'
          readOnly: true
        opened_at:
          type: string
          format: date-time
          readOnly: true
        maturity_date:
          type: string
          format: date
          readOnly: true
        interest_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          description: La moneda del producto de la posición.
          readOnly: true
      required:
      - amount
      - currency
      - id
      - interest_amount
      - maturity_date
      - opened_at
      - product
      - status
    PositionDetail:
      type: object
      description: Posición de inversión con el detalle del producto.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PositionStatusEnum'
          readOnly: true
        opened_at:
          type: string
          format: date-time
          readOnly: true
        maturity_date:
          type: string
          format: date
          readOnly: true
        interest_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          description: La moneda del producto de la posición.
          readOnly: true
        product_detail:
          allOf:
          - $ref: '#/components/schemas/InvestmentProduct'
          readOnly: true
      required:
      - amount
      - currency
      - id
      - interest_amount
      - maturity_date
      - opened_at
      - product
      - product_detail
      - status
    PositionStatusEnum:
      enum:
      - active
      - matured
      type: string
      description: |-
        * `active` - Activa
        * `matured` - Vencida
    Register:
      type: object
      description: Datos necesarios para registrar un usuario.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - password
    SpendingCategory:
      type: object
      description: El gasto acumulado de una categoría en el período.
      properties:
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        movements:
          type: integer
      required:
      - amount
      - category_id
      - category_name
      - movements
    SpendingReport:
      type: object
      description: El reporte de gasto por categoría.
      properties:
        currency:
          type: string
        from_date:
          type: string
        to_date:
          type: string
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SpendingCategory'
      required:
      - categories
      - currency
      - from_date
      - to_date
      - total
    TokenRefresh:
      type: object
      description: 'Body del refresh: el token que se quiere rotar.'
      properties:
        refresh:
          type: string
          description: El refresh token que se renueva (queda en blacklist).
      required:
      - refresh
    UpdateOfferStatusEnum:
      enum:
      - expired
      type: string
      description: '* `expired` - expired'
    User:
      type: object
      description: Datos públicos de un usuario.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        alias:
          type: string
          readOnly: true
          nullable: true
          description: Identificador público del usuario (único, en minúsculas).
      required:
      - alias
      - email
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
